name: Nightly Screener

on:
  schedule:
    # 9:30 PM UTC = 5:30 PM ET (post-market, Mon–Fri)
    - cron: "30 21 * * 1-5"
  workflow_dispatch:  # allows manual run from GitHub Actions tab

jobs:
  screen:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit stocks.json and push gh-pages

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install yfinance pandas lxml html5lib beautifulsoup4

      - name: Run screener
        env:
          SCREENER_SP500: "true"        # merge S&P 500 + curated DEFAULT_UNIVERSE
          SCREENER_MIN_MET: "4"         # minimum conditions met to surface a candidate
          SCREENER_OUT: "public/data/stocks.json"
        run: python screener_ci.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/stocks.json
          # Only commit if stocks.json actually changed
          git diff --staged --quiet || git commit -m "chore: nightly screener update [skip ci]"
          git push

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to GitHub Pages
        run: |
          git config user.name  "github-actions-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npx gh-pages -d dist -r "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
