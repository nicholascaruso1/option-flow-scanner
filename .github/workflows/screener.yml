name: Nightly Screener

on:
  schedule:
    # Primary: 22:43 UTC = 6:43 PM ET (post-close, odd minute to dodge
    # GitHub cron congestion — half-hour slots like 21:30 queue for hours)
    - cron: "43 22 * * 1-5"
    # Backup/self-heal: 3:13 AM UTC Tue–Sat = 11:13 PM ET Mon–Fri.
    # If the evening run was badly delayed or failed, this catches it before
    # morning. Duplicate data is harmless — the commit step skips no-op diffs.
    - cron: "13 3 * * 2-6"
  workflow_dispatch:  # allows manual run from GitHub Actions tab

jobs:
  screen:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit stocks.json and push gh-pages

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install yfinance pandas lxml html5lib beautifulsoup4

      - name: Run screener
        env:
          SCREENER_SP500: "true"        # merge S&P 500 + curated DEFAULT_UNIVERSE
          SCREENER_MIN_MET: "4"         # minimum conditions met to surface a candidate
          SCREENER_OUT: "public/data/stocks.json"
        run: python screener_ci.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/stocks.json
          # Only commit if stocks.json actually changed
          git diff --staged --quiet || git commit -m "chore: nightly screener update [skip ci]"
          git push

      - name: Tier 1 mechanical check (candle-based, isolated from screener/build)
        # Runs detectC123 + invalidation check against all tracked AI cards,
        # fires Tier 2 (Claude) only on meaningful structural change.
        # continue-on-error so a Tier 1 failure never blocks the site build/deploy below.
        continue-on-error: true
        run: node scripts/tier1_check.mjs

      - name: Commit Tier 1 state
        run: |
          git add scripts/tier1_state.json
          git diff --staged --quiet || git commit -m "chore: tier1 state update [skip ci]"
          git push

      - name: Build site
        run: npm run build

      - name: Deploy to GitHub Pages
        run: |
          git config user.name  "github-actions-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npx gh-pages -d dist -r "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
